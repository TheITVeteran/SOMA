
<!DOCTYPE html>
<html lang="en">

    <title>SOMA File Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#09090b', // Zinc 950
                        surface: '#18181b',    // Zinc 900
                        surfaceHighlight: '#27272a', // Zinc 800
                        border: '#27272a',     // Zinc 800
                        text: {
                            primary: '#ffffff', // Pure White
                            secondary: '#a1a1aa', // Zinc 400
                            muted: '#52525b',    // Zinc 600
                        },
                        accent: {
                            DEFAULT: '#facc15', // Yellow 400
                            hover: '#eab308',   // Yellow 500
                            glow: 'rgba(250, 204, 21, 0.2)',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        
        /* Pro overrides for sleek text */
        .prose { color: #ffffff !important; }
        .prose p { color: #ffffff !important; }
        .prose strong { color: #ffffff !important; }
        .prose code { color: #ffffff !important; }
        
        .glass-panel {
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Beta Theme Transitions */
        .beta-theme .text-accent { color: #a855f7 !important; }
        .beta-theme .bg-accent { background-color: #a855f7 !important; }
        .beta-theme .border-accent { border-color: #a855f7 !important; }
        .beta-theme .bg-accent\/10 { background-color: rgba(168, 85, 247, 0.1) !important; }
    </style>
