        </div>
        <div className="tb-status">
          <div className="tension-wrap">
            <span>tension</span>
            <div className="tension-track"><div className="tension-bar" style={{width:`${(maxStatus.tension||0)*100}%`}}/></div>
          </div>
          <div className="tb-sep"/>
          <div className="tb-persona">
            <span className="p-name" style={{color:persona.color,fontFamily:'var(--mono)'}}>{persona.icon}</span>
            <span className="p-name" style={{color:persona.color}}>{persona.label}</span>
          </div>
          <div className="tb-sep"/>
          <div className="conn-dot" style={connected?{background:'var(--green)',boxShadow:'0 0 6px rgba(16,185,129,.6)',animation:'pulse 2.5s infinite'}:{background:'var(--muted2)'}}/>
        </div>
      </div>

      {/* ── Full-screen preview ── */}
      {showPreview && (
        <>
          <div className="preview-fullscreen"><PreviewPane/></div>
          <div className="float-bubble">
            {bubbleOpen && (
              <div className="float-window">
                <div className="fw-header">
                  <span style={{color:persona.color,fontFamily:'var(--mono)',fontSize:16}}>{persona.icon}</span>
                  <span className="fw-title">MAX</span>
                  <span style={{fontSize:11,color:persona.color,fontWeight:600}}>{persona.label}</span>
                  <button className="fw-close" onClick={()=>setBubbleOpen(false)} style={{display:'flex'}}>{ICONS.close}</button>
                </div>
                <div className="fw-messages">
                  {messages.slice(-8).map(msg=>{
                    const isUser=msg.role==='user';
                    const p2=PERSONAS[msg.persona]||PERSONAS.companion;
                    const preview=msg.text.replace(/```[\s\S]*?```/g,'[code]').slice(0,220);
                    return (
                      <div key={msg.id} style={{display:'flex',flexDirection:isUser?'row-reverse':'row',gap:6,alignItems:'flex-start'}}>
                        <div style={{width:22,height:22,borderRadius:6,background:isUser?'var(--accent)':'var(--s3)',border:isUser?'none':'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:isUser?9:14,fontWeight:'bold',color:isUser?'#fff':p2.color,flexShrink:0,marginTop:1,fontFamily:'var(--mono)'}}>
                          {isUser?'YOU':p2.icon}
                        </div>
                        <div style={{background:isUser?'#1e1040':'var(--s2)',border:'1px solid '+(isUser?'#3d1f80':'var(--border)'),borderRadius:isUser?'7px 2px 7px 7px':'2px 7px 7px 7px',padding:'6px 10px',fontSize:11.5,lineHeight:1.6,maxWidth:'82%',wordBreak:'break-word'}}>
                          {preview}{msg.text.length>220?'…':''}
                        </div>
                      </div>
                    );
                  })}
                  {isThinking&&(
                    <div style={{display:'flex',gap:6,alignItems:'center'}}>
                      <div style={{width:22,height:22,borderRadius:6,background:'var(--s3)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:persona.color,fontFamily:'var(--mono)'}}>{persona.icon}</div>
                      <div style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'2px 7px 7px 7px',padding:'8px 10px'}}>
                        <div className="thinking-dots"><span/><span/><span/></div>
                      </div>
                    </div>
                  )}
                </div>
                <div className="fw-input-row">
                  <textarea className="fw-input" rows={1} placeholder="Ask MAX…" value={bubbleInput}
                    onChange={e=>setBubbleInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=bubbleInput.trim();if(t){setBubbleInput('');sendMessage(t);}}}}
                  />
                  <button className="fw-send" disabled={isThinking||!bubbleInput.trim()} style={{display:'flex',alignItems:'center',justifyContent:'center'}}
                    onClick={()=>{const t=bubbleInput.trim();if(t){setBubbleInput('');sendMessage(t);}}}
                  >{ICONS.send}</button>
                </div>
              </div>
            )}
            <button className="float-fab" onClick={()=>setBubbleOpen(o=>!o)} title="Chat with MAX">
              {bubbleOpen ? <span style={{display:'flex'}}>{ICONS.close}</span> : <span style={{display:'flex'}}>{ICONS.bolt}</span>}
            </button>
          </div>
        </>
      )}

      {/* ── Body (IDE mode) ── */}
      <div className="ide-body" style={{display:showPreview?'none':'flex'}}>
        {/* Activity bar */}
        <div className="actbar">
          {[
            {id:'files',  icon:ICONS.file,   title:'Explorer'},
            {id:'search', icon:ICONS.search, title:'Search'},
          ].map(item=>(
            <button key={item.id} className={`act-btn ${sideTab===item.id&&sidebarOpen?'active':''}`} title={item.title}
              onClick={()=>{ if(sideTab===item.id&&sidebarOpen){setSidebarOpen(false);}else{setSideTab(item.id);setSidebarOpen(true);} }}>
              {item.icon}
            </button>
          ))}
          <button className={`act-btn ${sideTab==='goals'&&sidebarOpen?'active':''}`} title="Goals"
            onClick={()=>{ if(sideTab==='goals'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('goals');setSidebarOpen(true);} }}>
            {ICONS.target}
            {goals.length>0&&<span className="act-badge"/>}
          </button>
          <button className={`act-btn ${sideTab==='git'&&sidebarOpen?'active':''}`} title="Source Control"
            onClick={()=>{ if(sideTab==='git'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('git');setSidebarOpen(true);} }}>
            {ICONS.git}
            {DEMO_GIT.length>0&&<span className="act-badge" style={{background:'var(--amber)'}}/>}
          </button>
          <div className="act-spacer"/>
          <button className="act-btn" title="Setup local AI" onClick={()=>setShowSetup(true)}>{ICONS.bolt}</button>
          <button className="act-btn" title="Settings" onClick={()=>setShowSettings(true)}>{ICONS.settings}</button>
        </div>

        {/* Sidebar */}
        <div className={`sidebar ${!sidebarOpen?'collapsed':''}`} style={{width:sidebarOpen?sidebarW:0}}>
          {sideTab==='files'&&(
            <>
              <div className="sb-header">
                <span>Explorer</span>
                <div className="sb-actions">
                  <button className="sb-icon-btn" title="New file" onClick={newFile}>{ICONS.plus}</button>
                  <button className="sb-icon-btn" title="New folder" onClick={()=>{const n=prompt('Folder name:');if(n) alert('Folder "'+n+'" added (demo mode)');}}>{ICONS.newFolder}</button>
                  <button className="sb-icon-btn" title="Collapse all" onClick={collapseAll}>{ICONS.collapse}</button>
                </div>
              </div>
              <div className="sb-scroll">
                <div className="tree-group">
                  <div className="tree-group-label" style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingRight:8}}>
                    <span>{connected && realFiles ? cwd : 'my-fullstack-app'}</span>
                    {connected && <button className="sb-icon-btn" onClick={()=>listFiles('.').then(f=>f&&setRealFiles(f))} title="Refresh">{ICONS.reload}</button>}
                  </div>
                  {!realFiles && <FileTree files={DEMO_FILES} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen}/>}
                  {realFiles && realFiles.length === 0 && <div className="tree-loading">{ICONS.reload} Loading files…</div>}
                  {realFiles && realFiles.length > 0 && <FileTree files={realFiles} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen}/>}
                </div>
              </div>
            </>
          )}
          {sideTab==='search'&&(
            <>
              <div className="sb-header"><span>Search</span></div>
              <div style={{padding:'8px 10px'}}>
                <input className="add-goal-input" style={{width:'100%'}} placeholder="Search files…" value={searchQ} onChange={e=>setSearchQ(e.target.value)} autoFocus/>
              </div>
              <div className="sb-scroll">
                {searchQ && (filteredFiles||[]).map(f=>(
                  <div key={f.id} className="tree-item" onClick={()=>openFile(f)}>
                    <span className="ti-icon">{fileIcon(f.name)}</span>
                    <span className="ti-name">{f.name}</span>
                  </div>
                ))}
                {searchQ && !filteredFiles?.length && <div style={{padding:'10px 12px',fontSize:11.5,color:'var(--muted)'}}>No results</div>}
                {!searchQ && <div style={{padding:'10px 12px',fontSize:11.5,color:'var(--muted2)'}}>Type to search</div>}
              </div>
            </>
          )}
          {sideTab==='goals'&&(
            <>
              <div className="sb-header">
                <span>MAX Goals</span>
                <span style={{color:'var(--accent2)',fontSize:12,fontWeight:700}}>{goals.length}</span>
              </div>
              <div className="sb-scroll">
                {goals.length===0&&<div style={{padding:'16px 12px',fontSize:11.5,color:'var(--muted)',textAlign:'center'}}>No active goals.</div>}
                {goals.map(g=>(
                  <div key={g.id} className="goal-item">
                    <div className="goal-dot"/>
                    <span className="goal-text">{g.title}</span>
                    <button className="goal-done-btn" title="Mark done" onClick={()=>doneGoal(g.id)} style={{display:'flex'}}>{ICONS.check}</button>
                  </div>
                ))}
              </div>
              <div className="add-goal-form">
                <input className="add-goal-input" placeholder="Add a goal…" value={newGoal} onChange={e=>setNewGoal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addGoal()}/>
                <button className="add-goal-btn" onClick={addGoal} style={{display:'flex',alignItems:'center'}}>{ICONS.plus}</button>
              </div>
            </>
          )}
          {sideTab==='git'&&(
            <GitPanel
              connected={connected} maxUrl={maxUrl}
              gitStaged={gitStaged} setGitStaged={setGitStaged}
              openFile={openFile}
              onRunInTerminal={cmd=>{setBottomTab('terminal');setShowBottom(true);runCommand(cmd);}}
            />
          )}
        </div>

        {/* Sidebar resize handle */}
        {sidebarOpen && (
          <div className="sidebar-resize" onMouseDown={e=>{setDraggingSidebar(true);sidebarDragX.current=e.clientX;sidebarDragW.current=sidebarW;}}/>
        )}

        {/* Editor pane */}
        <div className="editor-pane">
          {/* Pending changes banner */}
          {pendingChanges.filter(p=>p.status==='pending').length > 0 && (
            <div className="changes-banner">
              <div className="cb-label">
                <span style={{display:'flex'}}>{ICONS.warning}</span>
                {pendingChanges.filter(p=>p.status==='pending').length} pending {pendingChanges.filter(p=>p.status==='pending').length===1?'change':'changes'} from MAX
              </div>
              <button className="cb-accept-all" onClick={()=>{setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'accepted'}:p));playAccept();setTimeout(()=>{setChokoTyping(true);setTimeout(()=>{setChokoTyping(false);playChokoPop();setChokoMsg("waku-waku!! ✨ all changes accepted! MAX-senpai's code is LIVE now~ 🎀💖");setTimeout(()=>setChokoMsg(null),6000);},800);},300);}}>
                Accept All
              </button>
              <button className="cb-reject-all" onClick={()=>setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'rejected'}:p))}>
                Reject All
              </button>
            </div>
          )}
          <div className="tabs-bar">
            {openTabs.map(t=>(
              <div key={t.name} className={`tab ${activeTab===t.name?'active':''}`} onClick={()=>setActiveTab(t.name)}>
                <span className="tab-icon">{fileIcon(t.name)}</span>
                {t.name}
                {unsaved[t.name]
                  ? <span className="tab-dot" title="Unsaved changes"/>
                  : <span className="tab-close" onClick={e=>closeTab(e,t.name)} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>{ICONS.close}</span>
                }
              </div>
            ))}
            {openTabs.length===0&&<span className="tab-welcome">Open a file</span>}
          </div>
          <div style={{flex:1,overflow:'hidden',position:'relative',display:activeTab?'flex':'none',flexDirection:'column'}}>
            <MonacoEditor
              key={activeTab}
              fileName={activeTab}
              content={fileContents[activeTab] ?? (DEMO_FILE_CONTENTS[activeTab] || '')}
              onChange={content => handleEditorChange(activeTab, content)}
            />
            <div className={`save-status ${saveStatus==='saved'?'show':''}`}>
              {saveStatus==='saving'?'saving…':'✓ saved'}
            </div>
          </div>
          {!activeTab && (
            <div className="welcome">
              <div className="welcome-logo">Maxwell</div>
              <div className="welcome-hint">Open a file or tell MAX what to build →<br/><br/><kbd>Ctrl+K</kbd> palette &nbsp; <kbd>Ctrl+S</kbd> save &nbsp; <kbd>/</kbd> commands</div>
            </div>
          )}
          {showBottom && (
            <div className="bottom-panel" style={{height:bottomH}}>
              <div className="bp-resize" onMouseDown={e=>{setDraggingBottom(true);bottomDragY.current=e.clientY;bottomDragH.current=bottomH;}}/>
              <div className="bp-tabs">
                <div className={`bp-tab ${bottomTab==='terminal'?'active':''}`} onClick={()=>setBottomTab('terminal')}>{ICONS.terminal}&nbsp; Terminal</div>
                <div className={`bp-tab ${bottomTab==='output'?'active':''}`} onClick={()=>setBottomTab('output')}>Output</div>
                <div className={`bp-tab ${bottomTab==='problems'?'active':''}`} onClick={()=>setBottomTab('problems')}>{ICONS.warning}&nbsp; Problems</div>
                <button className="sb-icon-btn bp-close" style={{display:'flex'}} onClick={()=>setShowBottom(false)}>{ICONS.close}</button>
              </div>
              {/* Terminal tab */}
              {bottomTab==='terminal' && <>
                <div className="terminal-body" ref={termBodyRef} onClick={()=>termInputRef.current?.focus()}>
                  {termLines.map(l=>(
                    <div key={l.id} className="term-line">
                      {l.type==='prompt'&&<><span className="term-prompt">❯</span><span className="term-cmd">{l.text}</span></>}
                      {l.type==='out' &&<span className="term-out">{l.text}</span>}
                      {l.type==='ok'  &&<span className="term-ok">{l.text}</span>}
                      {l.type==='err' &&<span className="term-err">{l.text}</span>}
                      {l.type==='info'&&<span className="term-info">{l.text}</span>}
                    </div>
                  ))}
                  {termRunning && <div className="term-line"><span className="term-info"><span className="term-spinner">◌</span> running…</span></div>}
                </div>
                <div className="term-input-row">
                  <span className="term-prompt">❯</span>
                  <input ref={termInputRef} className="term-input"
                    placeholder={connected?"Run a command…":"Run a command… (demo mode)"}
                    value={termInput} onChange={e=>setTermInput(e.target.value)}
                    onKeyDown={e=>{
                      if(e.key==='Enter'){e.preventDefault();runCommand(termInput);}
                      if(e.key==='ArrowUp'){e.preventDefault();const nx=Math.min(termHistIdx+1,termHistory.length-1);setTermHistIdx(nx);setTermInput(termHistory[nx]||'');}
                      if(e.key==='ArrowDown'){e.preventDefault();const nx=Math.max(termHistIdx-1,-1);setTermHistIdx(nx);setTermInput(nx===-1?'':termHistory[nx]||'');}
                      if(e.key==='l'&&e.ctrlKey){e.preventDefault();setTermLines([]);}
                    }}
                    disabled={termRunning} autoComplete="off" spellCheck="false"
                  />
                  {termRunning&&<span className="term-spinner" style={{color:'var(--amber)',fontSize:13}}>◌</span>}
                </div>
              </>}
              {/* Output tab */}
              {bottomTab==='output' && (
                <div className="terminal-body">
                  <div className="term-line"><span className="term-info">[MAX] Booting agent… done</span></div>
                  <div className="term-line"><span className="term-ok">[Brain] Smart tier: DeepSeek online</span></div>
                  <div className="term-line"><span className="term-ok">[Memory] Loaded 247 memories</span></div>
                  <div className="term-line"><span className="term-ok">[GoalEngine] 3 active goals</span></div>
                  <div className="term-line"><span className="term-info">[Sentinel] Watching ./src …</span></div>
                  <div className="term-line"><span className="term-ok">[Server] Dashboard at http://localhost:3100/dashboard</span></div>
                </div>
              )}
              {/* Problems tab */}
              {bottomTab==='problems' && (
                <div className="terminal-body">
                  <div className="term-line" style={{color:'var(--green)',gap:6}}>
                    <span style={{display:'flex'}}>{ICONS.check}</span>
                    <span>No problems detected in workspace</span>
                  </div>
                </div>
              )}
            </div>
          )}
          {!showBottom&&(
            <div style={{borderTop:'1px solid var(--border)',padding:'0 12px',height:28,display:'flex',alignItems:'center',gap:8,background:'var(--s1)',flexShrink:0}}>
              <button className="bp-tab" style={{border:'none',background:'transparent',cursor:'pointer',display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowBottom(true)}>
                {ICONS.terminal} Terminal
              </button>
            </div>
          )}
        </div>

        {/* ── MAX chat panel ── */}
        <div className="max-panel">
          <div className="mp-header">
            <div className="mp-title">MAX</div>
            <div style={{flex:1}}/>
            <div className="mp-mode">
              <button className={`mp-mode-btn ${chatMode==='swarm'?'active':''}`} onClick={()=>setChatMode(m=>m==='swarm'?null:'swarm')}>
                <span style={{display:'inline-flex',verticalAlign:'middle',marginRight:3}}>{ICONS.bolt}</span> Swarm
              </button>
              <button className={`mp-mode-btn ${chatMode==='debate'?'active':''}`} onClick={()=>setChatMode(m=>m==='debate'?null:'debate')}>
                ⚖ Debate
              </button>
            </div>
          </div>
          {/* Token savings bar */}
          <div className="savings-bar">
            <span className="sb-saved">{ICONS.bolt} {savings.totalLocal} local</span>
            <div className="sb-track"><div className="sb-fill" style={{width:(savings.totalAll>0?(savings.totalLocal/savings.totalAll*100):0)+'%'}}/></div>
            <span className="sb-label">{savings.totalAll>0?Math.round(savings.totalLocal/savings.totalAll*100):0}% free</span>
            <button onClick={()=>setAutoRoute(a=>!a)} style={{padding:'2px 8px',borderRadius:4,border:'1px solid '+(autoRoute?'rgba(16,185,129,.4)':'var(--border)'),background:autoRoute?'rgba(16,185,129,.1)':'transparent',color:autoRoute?'var(--green)':'var(--muted)',fontSize:10,fontWeight:700,cursor:'pointer',transition:'all .15s',letterSpacing:.3}}>
              {autoRoute
    ? <>{ICONS.autoOn} AUTO</>
    : <>{ICONS.autoOff} MANUAL</>}
            </button>
          </div>
          {insight&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div className="insight"><div className="ins-label">Insight</div>{insight}</div>
            </div>
          )}
          <div className="mp-messages">
            {messages.map(msg=><MaxMsg key={msg.id} msg={msg} pendingChanges={pendingChanges} setPendingChanges={setPendingChanges} setActiveTab={setActiveTab}/>)}
            {isThinking&&<Thinking label={thinkLabel}/>}
            <div ref={messagesEndRef}/>
          </div>
          {!connected&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',borderRadius:6,padding:'6px 10px',fontSize:11.5,color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}>
                <span style={{color:'var(--red)',display:'flex'}}>{ICONS.dot}</span>
                MAX offline — <code style={{background:'var(--s3)',padding:'1px 4px',borderRadius:3,color:'var(--text)',fontFamily:'var(--mono)',fontSize:10.5}}>node launcher.mjs --mode api</code>
              </div>
            </div>
          )}
          <div className="mp-input-wrap" style={{position:'relative'}}>
            {chatMode&&(
              <div className="cmd-mode-badge">
                {chatMode==='swarm'?<span style={{display:'inline-flex'}}>{ICONS.bolt}</span>:'⚖'} {chatMode.toUpperCase()}
                <button onClick={()=>setChatMode(null)} style={{display:'flex'}}>{ICONS.close}</button>
              </div>
            )}
            {slashSuggestions.length>0&&(
              <div className="slash-picker">
                {slashSuggestions.map((s,i)=>(
                  <div key={s.cmd} className={`slash-item ${i===slashIdx?'sel':''}`} onMouseDown={()=>{setInput(s.cmd+' ');setSlashSuggestions([]);inputRef.current?.focus();}}>
                    <span className="sc-cmd">{s.cmd}</span>
                    <span className="sc-desc">{s.desc}</span>
                  </div>
                ))}
              </div>
            )}
            <div className="input-row">
              <textarea ref={inputRef} className="mp-textarea"
                placeholder={chatMode?`${chatMode} mode — describe your task…`:"Talk to MAX… or /command"}
                value={input} onChange={handleInputChange} onKeyDown={handleKeyDown} rows={1}
                onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px';}}
              />
              <button className="send-btn" onClick={()=>sendMessage()} disabled={isThinking||!input.trim()} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
                {ICONS.send}
              </button>
            </div>
          </div>
        </div>
      </div>
      {/* ── Status bar ── */}
      <StatusBar
        connected={connected} maxStatus={maxStatus} goals={goals}
        activeTab={activeTab} saveStatus={saveStatus} gitBranch={gitBranch}
        persona={persona} problemCount={0}
        onClickGit={()=>{setSideTab('git');setSidebarOpen(true);}}
        onClickGoals={()=>{setSideTab('goals');setSidebarOpen(true);}}
        onClickErrors={()=>{setBottomTab('problems');setShowBottom(true);}}
        onClickMemory={()=>setShowSettings(true)}
        onClickLang={()=>{}}
        onClickShortcuts={()=>setShowShortcuts(true)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
