name: "SOMA OS Prototype"
version: "0.1.0-alpha"
author: "SOMA Architecture Team"
description: "Transforms Windows into an AI-Native Cognitive Shell. Strips bloat, optimizes VRAM, installs Ollama, and boots the SOMA React-based Glass Interface."

requirements:
  minOS: "Windows 11 22H2"
  vram: "8GB Recommended"
  ram: "16GB Recommended"

stages:
  - id: debloat
    name: "VRAM Optimization (Atlas Core)"
    action: "RunAML"
    file: "Configuration/00-AtlasDebloat.aml"
    
  - id: ai_core
    name: "Install Local Cognition (Ollama + Models)"
    action: "RunAML"
    file: "Configuration/01-SomaInit.aml"
    
  - id: shell_replacement
    name: "Hijack Win32 Shell"
    action: "RunAML"
    file: "Configuration/02-SomaShell.aml"